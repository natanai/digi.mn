appId: mn.digi.engine
productName: digi.mn
asar: false
directories:
  output: release
files:
  - main.cjs
  - preview-demo.cjs
  - project-drop.cjs
  - updater.cjs
  - preload.cjs
  - package.json
extraResources:
  - from: ../dist
    to: client
  - from: build/worker.mjs
    to: worker.mjs
  - from: ../scripts/asset-manifest-lib.mjs
    to: asset-manifest-lib.mjs
  - from: apply-update.ps1
    to: apply-update.ps1
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: digi.mn-${version}-windows-x64.exe
portable:
  requestExecutionLevel: user
