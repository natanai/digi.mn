name: Bootstrap independent engine snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-engine.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Clone public pre-programmed source
        run: |
          git clone --depth 1 --branch main https://github.com/natanai/pre-programmed.git /tmp/source
          echo "SOURCE_SHA=$(git -C /tmp/source rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Import application and engine, keeping digi.mn identity
        run: |
          rsync -a \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/audit/' \
            --exclude '/README.md' \
            --exclude '/docs/' \
            --exclude '/node_modules/' \
            /tmp/source/ ./
          mkdir -p docs
          cp /tmp/source/docs/feature-boundaries.md docs/feature-boundaries.md
          cp /tmp/source/docs/author-resource-ownership.md docs/author-resource-ownership.md
          cp /tmp/source/docs/semantic-reference-contract.md docs/semantic-reference-contract.md
          printf 'source: natanai/pre-programmed\nsource_commit: %s\nimported_for: digi.mn independent adaptation\n' "$SOURCE_SHA" > docs/source-snapshot.txt
      - name: Commit imported engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: import independent pre-programmed engine snapshot"
            git push
          fi
