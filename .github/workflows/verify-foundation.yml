name: Verify digi.mn foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-foundation.yml
      - src/features/streets/**
      - src/App.tsx
      - index.html
      - worker/features/narrativePersistence.ts
      - worker/features/narrativeValidation.ts
      - scripts/verify-local-runtime.mjs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/features/streets/
      - run: npm run build
      - run: npm run verify:local
