name: Verify digi.mn foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-foundation.yml
      - src/**
      - worker/**
      - scripts/**
      - package.json
      - package-lock.json
      - index.html
      - vite.config.ts
      - tsconfig.json
      - tsconfig.app.json
      - tsconfig.node.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --check desktop/main.cjs && node --check desktop/updater.cjs && node --check desktop/preload.cjs
      - run: node --test desktop/updater.nodecheck.cjs
      - run: npx vitest run src/features/streets/
      - run: npm run build
      - run: npm run verify:local
