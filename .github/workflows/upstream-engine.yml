name: Review pre-programmed upstream

on:
  schedule:
    # Weekly check, Monday morning UTC. No ChatGPT session is required.
    - cron: "17 13 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/upstream-engine.yml
      - scripts/upstream/sync-pre-programmed.sh
      - docs/source-snapshot.txt

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: digi-upstream-engine
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Avoid overwriting a pending upstream review
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --base main --state open --json headRefName,number \
            --jq '[.[] | select(.headRefName | startswith("sync/pre-programmed-"))] | .[0].number // empty')"
          if [[ -n "$pr" ]]; then
            echo "Pending upstream integration PR #$pr needs review. No new branch will overwrite it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply safe three-way changes from upstream
        if: steps.pending.outputs.skip == 'false'
        run: bash scripts/upstream/sync-pre-programmed.sh

      - name: Verify shared and digi.mn behavior
        if: steps.pending.outputs.skip == 'false' && env.UPSTREAM_CHANGED == 'true'
        run: |
          npm ci
          npm run verify
          npm run verify:local

      - name: Propose an engine integration PR
        if: steps.pending.outputs.skip == 'false' && env.UPSTREAM_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync/pre-programmed-${UPSTREAM_HEAD:0:12}"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "::warning::Sync branch $branch already exists; refusing to overwrite it."
            exit 0
          fi
          git push origin "HEAD:refs/heads/$branch"
          pr_body="Safe, reviewable three-way integration from pre-programmed. Upstream base: $UPSTREAM_BASE. Upstream head: $UPSTREAM_HEAD. Digi-specific features are retained and tests passed. Review this PR before merging."
          if gh pr create --base main --head "$branch" \
            --title "Sync pre-programmed engine through ${UPSTREAM_HEAD:0:12}" \
            --body "$pr_body"; then
            echo "Created upstream review PR." >> "$GITHUB_STEP_SUMMARY"
          else
            # Repository settings can forbid GitHub Actions from creating PRs.
            # Preserve the verified branch and notify the owner via an issue.
            url="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "::warning::GitHub Actions could not open a PR. Verified branch retained: $url"
            echo "Review and open a PR: $url" >> "$GITHUB_STEP_SUMMARY"
            issue_title="Upstream engine review ready: ${UPSTREAM_HEAD:0:12}"
            existing="$(gh issue list --state open --search "$issue_title in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
            if [[ -z "$existing" ]]; then
              gh issue create --title "$issue_title" \
                --body "A fully tested pre-programmed sync branch is ready for review, but GitHub Actions is not allowed to create pull requests. Open this compare page to create the PR: $url. The branch preserves digi.mn-specific features and will not be overwritten." \
                || echo "::warning::Could not create fallback issue; see workflow summary and sync branch."
            fi
          fi

      - name: Record reconciliation details
        if: always()
        run: |
          echo "Pinned pre-programmed source:" >> "$GITHUB_STEP_SUMMARY"
          cat docs/source-snapshot.txt >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pending PRs and GitHub Actions failures must be reviewed before claiming upstream parity." >> "$GITHUB_STEP_SUMMARY"
